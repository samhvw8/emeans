# Header of the emeans C ABI. Regenerate after an API change:
#   mise run bind:go:header   (cbindgen --config cbindgen.toml --output include/emeans.h)
language = "C"
include_guard = "EMEANS_H"
pragma_once = false
autogen_warning = """/* emeans C API. Generated by cbindgen from crates/emeans-ffi/src/lib.rs: do not edit.
 *
 * e-means clustering (mini-batch k-means with scaling laws) on CPU, Apple GPUs
 * (Metal) and NVIDIA GPUs (CUDA): train / assign, a reusable trained model,
 * automatic k in two levels with incremental updates, near-duplicate groups.
 *
 * STATUS AND ERRORS
 *   Every function that can fail returns int32_t: EMEANS_OK (0) or an error
 *   code (EMEANS_INVALID_ARGUMENT, EMEANS_ERROR, EMEANS_PANIC). The message of
 *   the failure is emeans_last_error(): it is THREAD-LOCAL, kept until the same
 *   thread's next emeans call. A runtime that moves work between OS threads
 *   (Go, some green-thread VMs) must read it on the thread that made the call.
 *   On failure no out-pointer is written and nothing needs freeing.
 *
 * OWNERSHIP (who frees what)
 *   EmeansModel*      from emeans_model_*        -> emeans_model_free
 *   EmeansHierarchy*  from emeans_auto_cluster,
 *                     emeans_hierarchy_load/_from_bytes -> emeans_hierarchy_free
 *   EmeansResult*     from every call with out_result/out_labels -> emeans_result_free
 *   char* via char**  (configs, info, backends)  -> emeans_string_free
 *   Borrowed, never freed: EmeansArray views (valid until their result or model
 *   is freed), emeans_result_json, emeans_last_error, emeans_version.
 *   Inputs (data, bytes, strings) stay the caller's: emeans reads them during
 *   the call only and never keeps a pointer to them.
 *
 * DATA, SHAPES, UNITS
 *   Rows are row-major float (IEEE 754 binary32), n rows of d values, read in
 *   place (no copy); do not change them during the call. A NULL data pointer
 *   is allowed only when n * d is 0. Arrays must be aligned to their element
 *   type. Lengths are element counts, not bytes, except for byte buffers.
 *   Distances are squared L2; similarities are inner products (cosine for
 *   unit rows). Times are seconds. Strings are NUL-terminated UTF-8.
 *
 * CONFIGS
 *   A JSON object of overrides of emeans_default_config(kind); NULL or "" for
 *   the defaults. Unknown keys are EMEANS_ERROR with a message that names
 *   them. "backend" (e.g. "cpu", "metal", "cuda") is a key of every config.
 *
 * THREAD SAFETY
 *   Functions without a handle can run on any number of threads at once. A
 *   model is read-only after training: any threads may use it at once. A
 *   hierarchy may be read by several threads, but emeans_hierarchy_add must
 *   not overlap any other use of the same hierarchy. Results are read-only.
 *
 * STABILITY
 *   EMEANS_ABI_VERSION (and emeans_abi_version()) is 1. Within one ABI
 *   version, existing functions, structs, constants and result array names
 *   keep their meaning; new functions, new result arrays and new JSON keys may
 *   be added. A change that breaks a compiled caller raises the ABI version
 *   and the library's major version. Before 1.0 (now 0.x) the API is not yet
 *   frozen: a 0.x minor release may raise the ABI version.
 */"""
documentation = true
documentation_style = "c99"
cpp_compat = true
usize_is_size_t = true
style = "both"
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true

[export]
include = ["EmeansArray"]

[export.rename]
EmeansResult = "EmeansResult"
EmeansHierarchy = "EmeansHierarchy"
