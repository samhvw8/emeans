[package]
name = "emeans"
description = "e-means: mini-batch k-means with scaling laws (port of faiss contrib/e_means), on CPU, Metal and CUDA, with automatic k, incremental assignment and near-duplicate groups"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# The CUDA backend. Metal needs no feature: it is part of every macOS build.
cuda = ["emeans-cluster/cuda", "dep:emeans-cuda"]

[dependencies]
emeans-core.workspace = true
emeans-cluster.workspace = true
emeans-cuda = { workspace = true, optional = true }
anyhow.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
emeans-metal.workspace = true
