[package]
name = "emeans-python"
description = "Python binding of emeans (PyO3)"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/samhvw8/emeans"
publish = false

[lib]
name = "_emeans"
crate-type = ["cdylib"]

[features]
default = []
cuda = ["emeans-bindings-common/cuda"]

[dependencies]
emeans-bindings-common = { path = "../common" }
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
serde_json = "1.0.154"

[profile.release]
debug = 1

# Its own workspace: maturin builds it alone, with its own lock file.
[workspace]
